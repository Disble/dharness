name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows is not optional here: the .cmd shim routing that makes a
        # locally installed tool reachable only exists on that platform.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Written out rather than piped through /dev/stderr, which does not
      # exist in the Git Bash that runs this step on the Windows runner.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
        shell: bash
      - run: go vet ./...
      - run: go test ./... -race

      # L5: a gate nobody has watched fail is indistinguishable from no gate.
      # This asserts the local hook still refuses a broken file, so a hook that
      # quietly stopped enforcing cannot reach main.
      - name: Prove the local gate still fails
        run: bash scripts/verify-gate.sh
        shell: bash

      # The JavaScript sync writes into .dharness/ is dharness's code on the
      # consumer's commit: their gate runs react-doctor over it whenever it is
      # staged, and they cannot fix what sync rewrites. Audit it the same way
      # their gate does — staged, @latest — but failing on warnings too, so a
      # finding is fixed here before it reaches anyone. The bytes do not
      # depend on the OS, so one runner is enough.
      - name: Audit the generated JavaScript with react-doctor
        if: matrix.os == 'ubuntu-latest'
        run: |
          audit=$(mktemp -d)
          DHARNESS_GENERATED_JS_DIR="$audit/.dharness" go test ./internal/setup -run TestWriteGeneratedJSForAudit -count=1
          cd "$audit"
          git init -q
          printf '{"name":"generated-js-audit","private":true,"dependencies":{"react":"*"}}\n' > package.json
          printf 'node_modules/\n' > .gitignore
          # Installed first with lifecycle scripts off, then run with no
          # on-demand install: a bare npx could fetch and run install scripts.
          npm install --no-save --ignore-scripts --no-audit --no-fund react-doctor@latest
          git add -A
          npx --no-install react-doctor --staged --no-dead-code --no-score --no-supply-chain --blocking warning -y
        shell: bash
