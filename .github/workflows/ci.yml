name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows is not optional here: the .cmd shim routing that makes a
        # locally installed tool reachable only exists on that platform.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Written out rather than piped through /dev/stderr, which does not
      # exist in the Git Bash that runs this step on the Windows runner.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
        shell: bash
      - run: go vet ./...
      - run: go test ./... -race

      # L5: a gate nobody has watched fail is indistinguishable from no gate.
      # This asserts the local hook still refuses a broken file, so a hook that
      # quietly stopped enforcing cannot reach main.
      - name: Prove the local gate still fails
        run: bash scripts/verify-gate.sh
        shell: bash

      # The JavaScript sync writes into .dharness/ is dharness's code on the
      # consumer's commit: their gate runs react-doctor over it whenever it is
      # staged, and they cannot fix what sync rewrites. Audit it the way their
      # gate does — staged — but failing on warnings too, so a finding is fixed
      # here before it reaches anyone. Unlike their gate, the react-doctor here
      # is pinned by tools/react-doctor-audit's lockfile and installed with
      # lifecycle scripts off: CI changes only when this repository does, and
      # Dependabot's weekly bump is where a new rule shows up. The bytes do not
      # depend on the OS, so one runner is enough.
      - name: Audit the generated JavaScript with react-doctor
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci --prefix tools/react-doctor-audit --ignore-scripts --no-audit --no-fund
          doctor="$PWD/tools/react-doctor-audit/node_modules/.bin/react-doctor"
          audit=$(mktemp -d)
          DHARNESS_GENERATED_JS_DIR="$audit/.dharness" go test ./internal/setup -run TestWriteGeneratedJSForAudit -count=1
          cd "$audit"
          git init -q
          printf '{"name":"generated-js-audit","private":true,"dependencies":{"react":"*"}}\n' > package.json
          git add -A
          "$doctor" --staged --no-dead-code --no-score --no-supply-chain --blocking warning -y
        shell: bash

  # Dependabot's weekly react-doctor bump merges itself once verify passes on
  # both runners, so keeping the audit current is nobody's chore. A red bump
  # is not CI upkeep: it means a new react-doctor rule flags JavaScript
  # dharness generates, which consumers' @latest gates will flag too — a
  # dharness bug, fixed like any other. The guard is narrow on purpose: a
  # Dependabot PR that touches anything beyond the audit's two pinned files
  # is left for a person.
  automerge-react-doctor-bump:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merge when only the pinned audit files changed
        run: |
          files=$(gh pr diff "$PR" --name-only)
          echo "$files"
          if [ -z "$files" ]; then
            echo "No changed files reported; leaving this PR for a person."
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              tools/react-doctor-audit/package.json|tools/react-doctor-audit/package-lock.json) ;;
              *) echo "Not merging: $file is outside the pinned audit files."; exit 1 ;;
            esac
          done <<< "$files"
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
        shell: bash
