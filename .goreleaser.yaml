version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dharness
    main: ./cmd/dharness
    binary: dharness
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # The version has to reach the binary the same way it reaches a `go install`
    # build, or `dharness version` reports "dev" on a release.
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ['^docs:', '^test:', '^chore:']
