version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dharness
    main: ./cmd/dharness
    binary: dharness
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # The version has to reach the binary the same way it reaches a `go install`
    # build, or `dharness version` reports "dev" on a release.
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# release-please already wrote the notes into the release it created, from the
# same commits and with the same exclusions. A second generator here would
# overwrite them with its own wording, so goreleaser contributes binaries and
# nothing else.
changelog:
  disable: true

# The release exists before goreleaser runs, because release-please created it
# along with the tag. append uploads the archives into it instead of trying to
# create a release that is already there.
release:
  mode: append
