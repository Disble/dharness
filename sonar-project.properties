# SonarCloud analysis parameters for this repository.
#
# The managed coverage runtime (internal/setup/assets/coverage-tiers/runtime.mjs)
# spawns the consumer's own `dharness` binary by name. That is the point of a
# consumer-side gate: the tool that runs is the one installed on that machine, at
# whatever path that machine put it, and a fixed directory would bind the gate to
# one install layout - the one thing a copy of dharness cannot know.
#
# javascript:S4036 asks PATH to hold only fixed, unwriteable directories. Here the
# lookup is the intended behaviour rather than an oversight, and the spawn takes no
# argument that PATH itself supplies, so this is an accepted risk whose reason lives
# in the repository rather than in a click: the gate contract here says every
# suppression names its rule and explains itself in prose, and this one does.
sonar.issue.ignore.multicriteria=coveragetierss4036
sonar.issue.ignore.multicriteria.coveragetierss4036.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.coveragetierss4036.resourceKey=internal/setup/assets/coverage-tiers/runtime.mjs
