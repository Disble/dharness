sonar.projectKey=Disble_dharness
sonar.organization=disble

# Golden fixtures are excluded from duplication analysis, and only from that.
#
# A golden pins byte-for-byte output, so two fixtures for two projects that
# receive the same plan are near-identical on purpose — that identity is the
# assertion. `expo.txt` and `nextjs.txt` differ by the framework layer and
# nothing else, which is exactly what they exist to prove. Refactoring the
# shared bytes away would delete the property the fixtures are for.
#
# Scoped to duplication deliberately: these files stay in scope for every
# other rule, because they are reviewed by hand and a defect in one is a
# defect dharness ships.
sonar.cpd.exclusions=**/testdata/**
